spring.application.name=family-fleet


# JPA: a sémát a Flyway kezeli, a Hibernate csak ellenőrzi, hogy az entitások illeszkednek-e
#indításkor a Hibernate összeveti az entitásokat a sémával
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.open-in-view=false

# Lapozás: a kliens ne kérhessen egyszerre túl sok elemet
spring.data.web.pageable.max-page-size=100

# Időzóna a "mai nap" számításához és az ütemezéshez
app.time-zone=Europe/Budapest

# Napi emlékeztető: minden reggel 7-kor, 30/7/1 nappal az esedékesség előtt
app.reminder.enabled=true
app.reminder.cron=0 0 7 * * *
app.reminder.days-before=30,7,1
app.reminder.from=Family Fleet <noreply@familyfleet.local>

# SMTP: fejlesztéskor a compose.yaml Mailpit-konténere
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# A generált SQL a logban (a show-sql helyett a logger a helyes módszer)
logging.level.org.hibernate.SQL=DEBUG
spring.jpa.properties.hibernate.format_sql=true
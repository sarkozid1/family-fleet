# =========================================================
# Éles környezet. Minden titok és környezetfüggő érték környezeti változóból jön; a
# kötelezőknek szándékosan nincs alapértéke, így hiányuk esetén az alkalmazás el sem indul.
#
# Kötelező:  DB_URL, DB_USERNAME, DB_PASSWORD, MAIL_HOST, REMINDER_FROM, JWT_SECRET (min. 32 karakter)
# Ajánlott:  REGISTRATION_ALLOWED_EMAILS (vesszővel elválasztva; nélküle csak meghívóval lehet regisztrálni)
# Opcionális: PORT (8080), REGISTRATION_OPEN (false), JWT_TTL (PT1H), MAIL_PORT (587), MAIL_USERNAME, MAIL_PASSWORD,
#             MAIL_SMTP_AUTH (true), MAIL_SMTP_STARTTLS (true), REMINDER_CRON, REMINDER_ENABLED (true),
#             API_DOCS_ENABLED (false)
# =========================================================
server:
  # A felhős platformok (Railway, Heroku, Cloud Run) a PORT változóban adják meg a portot.
  port: ${PORT:8080}
  # A platform proxyja zárja le a HTTPS-t, és X-Forwarded-* fejlécekben adja tovább az eredeti
  # sémát és hostot. E nélkül a generált linkek (pl. a 201-es Location fejléc) http://belső-cím
  # alakúak lennének.
  forward-headers-strategy: framework

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:true}

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      ttl: ${JWT_TTL:PT1H}
    registration:
      # Élesben alapból zárt: csak a felsorolt címek és a háztartásba meghívottak regisztrálhatnak.
      open: ${REGISTRATION_OPEN:false}
      allowed-emails: ${REGISTRATION_ALLOWED_EMAILS:}
  reminder:
    enabled: ${REMINDER_ENABLED:true}
    cron: ${REMINDER_CRON:0 0 7 * * *}
    from: ${REMINDER_FROM}

logging:
  structured:
    format:
      # JSON-logok (Elastic Common Schema): a logkezelő (ELK, Loki, CloudWatch) mezőnként kereshet,
      # az MDC-ben lévő requestId külön mezőként kerül bele.
      console: ecs
  level:
    root: INFO

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}

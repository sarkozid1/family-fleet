services:
  postgres:
    image: 'postgres:18'
    environment:
      - 'POSTGRES_DB=familyfleet'
      - 'POSTGRES_USER=familyfleet'
      - 'POSTGRES_PASSWORD=familyfleet'
    ports:
      - '5432:5432'
    volumes:
      - 'pgdata:/var/lib/postgresql'

  # Fejlesztői SMTP-szerver: minden levelet elkap, semmit nem küld tovább.
  # Webes felület: http://localhost:8025
  mailpit:
    image: 'axllent/mailpit:v1.31.6'
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  pgdata:
